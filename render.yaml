services:
  - type: web
    name: internshield-backend
    runtime: python
    buildCommand: pip install -r backend_fastapi/requirements.txt
    startCommand: uvicorn backend_fastapi.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGIN
        value: "*"
